[package]
name = "coordinator"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AgentMesh Coordinator — TUI, AI planning, state management, and agent coordination"

[lib]
name = "coordinator"
path = "src/lib.rs"

[[bin]]
name = "coordinator"
path = "src/main.rs"

[dependencies]
# Workspace shared
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = "0.1"
async-nats = { workspace = true }
agent-protocol = { workspace = true }
futures = "0.3"

# TUI
ratatui = "0.28"
crossterm = "0.27"

# Database (PostgreSQL via sqlx with compile-time query checking)
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
] }

# HTTP client (for AI provider REST APIs)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Configuration
config = "0.14"
dotenvy = "0.15"

# Cryptography & Security
sha2 = "0.10"
hex = "0.4"
subtle = "2.5"

[dev-dependencies]
agent-mock = { path = "../agent-mock" }
agent-agy = { path = "../agent-agy" }

