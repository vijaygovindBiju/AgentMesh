[package]
name = "coordinator"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AgentMesh Coordinator — TUI, AI planning, state management, and agent coordination"

[[bin]]
name = "coordinator"
path = "src/main.rs"

[dependencies]
# Workspace shared
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-nats = { workspace = true }
agent-protocol = { workspace = true }

# TUI
ratatui = "0.28"
crossterm = "0.27"

# Database (PostgreSQL via sqlx with compile-time query checking)
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
] }

# HTTP client (for AI provider REST APIs)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Configuration
config = "0.14"
dotenvy = "0.15"
